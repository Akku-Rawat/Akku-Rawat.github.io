<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost in space · Akhilesh Rawat</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14131E">
<link rel="icon" href="/favicon.png" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#14131E;--line:#2D2B42;--text:#E8E3D8;--muted:#A6A2B6;--dim:#7C7894;--accent:#EDBE6C;--accent2:#7FD1B9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background-color:#0E0D18;background-image:radial-gradient(#FFFFFF26 1px,transparent 1.4px),radial-gradient(#EDBE6C30 1px,transparent 1.4px);background-size:53px 53px,37px 37px;background-position:0 0,19px 23px;color:var(--text);font:17px/1.7 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;background:#17152AF2;border:1px solid #3A3560;border-radius:20px;padding:32px 34px;box-shadow:0 14px 34px -16px #000000B3}
.prompt,.err{font:13px/1.7 "JetBrains Mono",ui-monospace,monospace;overflow-wrap:anywhere}
.prompt{color:var(--muted)}
.u{color:var(--accent2)}
.d{color:var(--dim)}
.err{color:#F09595;margin:4px 0 0}
h1{font:700 clamp(30px,6vw,42px)/1.1 "Bricolage Grotesque",Arial,sans-serif;letter-spacing:-.03em;margin:22px 0 10px}
p{margin:0;color:var(--muted)}
a{display:inline-block;margin-top:22px;padding:11px 18px;border-radius:12px;background:var(--accent);color:#2A1C10;text-decoration:none;font-weight:500}
a:hover{background:#F5CD85}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="prompt"><span class="u">akku@observatory</span><span class="d">:~$</span> cd <span id="path">this-page</span></div>
  <p class="err">cd: no such file or directory</p>
  <h1>This star isn't on the map.</h1>
  <p>The page you were looking for drifted off. The observatory is right where you left it.</p>
  <a href="/">← Back to the observatory</a>
</main>
<script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
